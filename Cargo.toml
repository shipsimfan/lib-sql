[workspace]
default-members = ["."]
members = ["sqlite"]

[workspace.package]
description = "Libraries for interacting with various SQL database management systems"

authors = ["Lance Hart <me@lancehart.ca>"]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/shipsimfan/lib-sql"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
sql.path = "."


[package]
name = "sql"
description = "Common interface definition for all supported SQL database management systems"

authors.workspace = true
edition.workspace = true
repository.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
lib-data-format = ["dep:data-format"]

[dependencies]
data-format = { git = "https://github.com/shipsimfan/lib-data-format", optional = true }
